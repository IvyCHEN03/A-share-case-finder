# 信源分级与检索入口
# 铁律：tier_3 只能发现线索，不能单独证明案例成立；每个严格案例必须至少有一份 tier_1 或 tier_2 一手文件支撑。

tier_1_一手结论依据:
  - name: 上海证券交易所发行上市审核系统
    entry: https://www.sse.com.cn （科创板/主板"发行上市审核"栏目，或 http://kcb.sse.com.cn）
    covers: 招股说明书、审核问询函回复、上市委会议文件、审核中心意见落实函回复
  - name: 深圳证券交易所发行上市审核系统
    entry: https://www.szse.cn （创业板/主板审核信息公开栏目）
  - name: 北京证券交易所审核系统
    entry: https://www.bse.cn
  - name: 中国证监会
    entry: http://www.csrc.gov.cn （注册批复见"行政许可信息公示"；规则见"规章制度"栏目）

tier_2_一手镜像与专业文件:
  - name: 巨潮资讯网
    entry: https://www.cninfo.com.cn （tier_1 文件最常用的官方镜像，支持公司名/代码全文检索与高级检索）
  - name: 荣大二郎神
    note: 按章节/表格结构化检索官方原文，检索到的片段仍须回原始PDF核对页码
  - 律师工作报告、法律意见书、保荐工作报告
  - 发行人公告

tier_3_仅供发现线索:
  - 见微数据、烯牛数据（一级市场/IPO项目库，按行业+板块+关键词筛候选）
  - Wind / iFinD / Choice（可导出同行业同类指标分布，做四分位数对标）
  - 易董 / 价值在线（自带预归类案例标签，标签本身须回一手核验）
  - 企查查 / 天眼查（仅用于专利当前状态等辅助核验，不能替代招股书）
  - 券商/律所专题文章、公众号盘点（易匿名化处理公司名，须反查真名）

铁律:
  - tier_3 只能用于发现线索，不能单独证明案例成立
  - 每个严格案例必须至少有一份 tier_1 或 tier_2 一手文件支撑
  - 数字、日期、主体身份、项目状态须分别交叉核验
  - 同一文件常有多版本（申报稿/上会稿/注册稿），引用前必须核对版本与披露日期
  - 问询回复通常分多轮，须按轮次通读，不能只看单轮
  - 任何"预归类/自带标签"的第三方案例库，其标签一律视为 tier_3 线索
